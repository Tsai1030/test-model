# 模型註冊表。run.py / score.py 以 id 引用。
#   engine:            轉接器類別（module:Class）
#   params:            傳給轉接器的參數
#   langs:             STT 支援的語言（本專案語言碼）；TTS 以 voices 的 key 決定支援哪些語言
#   backend_category:  換算 Jetson 速度時使用的類別（見 configs/hardware.yaml）
#   license:           授權（PoC 階段不設限，但報告會列出）
#   streaming:         串流能力（選填，報告顯示用）：native（原生串流）| chunked（有條件／分段模擬）|
#                      offline（整句處理）| sentence（TTS 逐句輸出）。未填時依引擎推定
#   specialized:       語言專用模型填語言碼（如 ja）；未填 = 多語模型。用於「專用 vs 多語」比較
#   user_suffix:       LLM 選填：附加在使用者訊息後的文字（如 Qwen3 的「 /no_think」關閉思考模式）。目前只有 llm_eval.py 使用
#
# 尚未寫轉接器的候選：sherpa-onnx 串流 zipformer、Vosk、CosyVoice 2/3、Style-BERT-VITS2、Fish-Speech、F5-TTS、
# Parler-TTS、Qwen3-TTS（需 GPU）。Parakeet-Redux 已寫轉接器，但 Windows 版 kestrel 沒有 AVX2 核心，需 Linux / Jetson

all_langs: &all_langs [en, es-ES, es-419, pt-BR, pt-PT, ja]
eu_langs: &eu_langs [en, es-ES, es-419, pt-BR, pt-PT]

stt:
  # ---- Whisper（faster-whisper / CTranslate2）：多語基準線，不同大小比較速度與準確度的取捨
  whisper-tiny-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: tiny, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-base-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: base, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-small-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: small, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-small-ct2-int8-beam5:          # 解碼參數比較：beam 5 通常較準、較慢
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: small, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 5}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-medium-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: medium, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-large-v3-turbo-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: large-v3-turbo, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT
  whisper-large-v3-ct2-int8:             # 準確度上限參考，也當 TTS 可懂度的 ASR 評審
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: large-v3, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cpu
    license: MIT

  # ---- 單語專用模型
  distil-large-v3-ct2-int8:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: distil-large-v3, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: [en]
    backend_category: ct2-cpu
    license: MIT
    specialized: en
  kotoba-whisper-v2-ct2-int8:            # repo 名稱請在 P0 確認
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: kotoba-tech/kotoba-whisper-v2.0-faster, device: cpu, compute_type: int8, cpu_threads: 4, beam_size: 1}
    langs: [ja]
    backend_category: ct2-cpu
    license: Apache-2.0
    specialized: ja

  # ---- 後端比較：同一個 Whisper small 改用 PyTorch（transformers）
  whisper-small-hf-fp32:
    engine: engines.stt.hf_engine:HFPipelineSTT
    params: {model: openai/whisper-small, device: cpu, dtype: float32, num_threads: 4}
    langs: *all_langs
    backend_category: torch-cpu
    license: MIT

  # ---- NVIDIA NeMo（歐語；Windows 請改用 WSL2 / Colab）
  parakeet-tdt-0.6b-v3:
    engine: engines.stt.nemo_engine:NeMoSTT
    params: {model: nvidia/parakeet-tdt-0.6b-v3, device: cpu}
    langs: *eu_langs
    backend_category: nemo-cpu
    license: CC-BY-4.0
  canary-1b-v2:
    engine: engines.stt.nemo_engine:NeMoSTT
    params: {model: nvidia/canary-1b-v2, device: cpu, canary: true}
    langs: *eu_langs
    backend_category: nemo-cpu
    license: CC-BY-4.0

  # ---- 第三晚（2026-10-01 調查）：排行榜上的小型多語模型
  qwen3-asr-0.6b:                          # LLM 式 ASR；CPU 用 fp32（約 3.8 GB），GPU 用 bf16 約減半
    engine: engines.stt.qwen3_asr_engine:Qwen3ASR
    params: {model: Qwen/Qwen3-ASR-0.6B-hf, device: cpu, dtype: float32, num_threads: 4}
    langs: *all_langs
    backend_category: torch-cpu
    license: Apache-2.0
    streaming: chunked                     # 只有 vLLM（GPU）後端支援串流
  nemotron-3.5-asr-0.6b:                   # 整句模式；以 locale 提示語言，可區分 pt-PT / pt-BR
    engine: engines.stt.nemotron_engine:NemotronASR
    params: {model: nvidia/nemotron-3.5-asr-streaming-0.6b, device: cpu, dtype: float32, num_threads: 4}
    langs: *all_langs
    backend_category: torch-cpu
    license: OpenMDW-1.1
    streaming: native
  nemotron-3.5-asr-0.6b-stream560:         # 串流模式：區塊 560 ms（lookahead 6）
    engine: engines.stt.nemotron_engine:NemotronASR
    params: {model: nvidia/nemotron-3.5-asr-streaming-0.6b, device: cpu, dtype: float32, num_threads: 4,
             streaming: true, lookahead_tokens: 6}
    langs: *all_langs
    backend_category: torch-cpu
    license: OpenMDW-1.1
    streaming: native
  parakeet-tdt-0.6b-v3-int8:               # 25 種歐洲語言，自動判斷語言（不接受語言參數）
    engine: engines.stt.onnx_asr_engine:OnnxAsrSTT
    params: {model: nemo-parakeet-tdt-0.6b-v3, quantization: int8}
    langs: *eu_langs
    backend_category: onnx-cpu
    license: CC-BY-4.0
    streaming: chunked
  sensevoice-small-int8:                   # 支援 zh / en / ja / ko / yue
    engine: engines.stt.sherpa_onnx_engine:SherpaOfflineSTT
    # 用 2024-07-17 原版：2025-09-09 int8 版不論語言設定都判斷成粵語（<|yue|>），日語輸出成簡體中文
    params: {kind: sense_voice, repo_id: csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17}
    langs: [en, ja]
    backend_category: onnx-cpu
    license: FunASR model license
    streaming: offline
  parakeet-redux:                          # 1.58-bit Parakeet v3（178 MB）；Windows 版 kestrel 無 AVX2 核心，需 Linux / Jetson
    engine: engines.stt.photon_engine:PhotonSTT
    params: {model: moondream/parakeet-redux, device: cpu}
    langs: *eu_langs
    backend_category: onnx-cpu
    license: CC-BY-4.0
    streaming: offline

  # ---- 第三晚：語言專用模型
  parakeet-tdt_ctc-0.6b-ja-int8:           # ReazonSpeech 35,000 小時日語訓練
    engine: engines.stt.sherpa_onnx_engine:SherpaOfflineSTT
    params: {kind: nemo_ctc, repo_id: csukuangfj/sherpa-onnx-nemo-parakeet-tdt_ctc-0.6b-ja-35000-int8}
    langs: [ja]
    backend_category: onnx-cpu
    license: CC-BY-4.0
    streaming: offline
    specialized: ja
  moonshine-tiny-ja:                       # 27M 參數
    engine: engines.stt.hf_seq_engine:HFSeqSTT
    params: {model: UsefulSensors/moonshine-tiny-ja, kind: moonshine, tokens_per_second: 13, num_threads: 4}
    langs: [ja]
    backend_category: torch-cpu
    license: Moonshine Community License
    streaming: offline
    specialized: ja
  parakeet-v3-ptbr-tagarela:               # Parakeet v3 以巴西 podcast 語料微調；只有 fp32（約 2.4 GB）
    engine: engines.stt.onnx_asr_engine:OnnxAsrSTT
    params: {model: nemo-conformer-tdt, repo_id: alefiury/parakeet-tdt-0.6b-v3-ptBR-TAGARELA-onnx}
    langs: [pt-BR, pt-PT]
    backend_category: onnx-cpu
    license: CC-BY-4.0
    streaming: chunked
    specialized: pt
  parakeet-tdt-0.6b-v2-int8:
    engine: engines.stt.onnx_asr_engine:OnnxAsrSTT
    params: {model: nemo-parakeet-tdt-0.6b-v2, quantization: int8}
    langs: [en]
    backend_category: onnx-cpu
    license: CC-BY-4.0
    streaming: chunked
    specialized: en
  granite-speech-5.0-470m-ctc:             # 非自回歸 CTC
    engine: engines.stt.hf_seq_engine:HFSeqSTT
    params: {model: ibm-granite/granite-speech-5.0-470m-turboctc, kind: ctc, num_threads: 4}
    langs: [en]
    backend_category: torch-cpu
    license: Apache-2.0
    streaming: offline
    specialized: en

  # ---- Jetson 版本（device: cuda）：在 Jetson 上實測時使用
  whisper-small-ct2-fp16-cuda:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: small, device: cuda, compute_type: float16, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cuda
    license: MIT
  whisper-large-v3-turbo-ct2-fp16-cuda:
    engine: engines.stt.faster_whisper_engine:FasterWhisperSTT
    params: {model: large-v3-turbo, device: cuda, compute_type: float16, beam_size: 1}
    langs: *all_langs
    backend_category: ct2-cuda
    license: MIT

tts:
  kokoro-82m:
    engine: engines.tts.kokoro_engine:KokoroTTS
    params: {device: cpu}
    voices: {en: af_heart, es-ES: ef_dora, es-419: ef_dora, pt-BR: pf_dora, ja: jf_alpha}   # 無 pt-PT
    backend_category: torch-cpu
    license: Apache-2.0
  kokoro-82m-cuda:
    engine: engines.tts.kokoro_engine:KokoroTTS
    params: {device: cuda}
    voices: {en: af_heart, es-ES: ef_dora, es-419: ef_dora, pt-BR: pf_dora, ja: jf_alpha}
    backend_category: torch-cuda
    license: Apache-2.0
  piper-medium:
    engine: engines.tts.piper_engine:PiperTTS
    params: {use_cuda: false}
    voices:                                  # 無日語
      en: en_US-lessac-medium
      es-ES: es_ES-davefx-medium
      es-419: es_MX-ald-medium
      pt-BR: pt_BR-faber-medium
      pt-PT: pt_PT-tugão-medium
    backend_category: onnx-cpu
    license: GPL-3.0 (engine 1.3+) / per-voice
  melotts:
    engine: engines.tts.melo_engine:MeloTTS
    params: {device: cpu}
    voices: {en: "EN:EN-US", es-ES: "ES:ES", es-419: "ES:ES", ja: "JP:JP"}   # 無葡語
    backend_category: torch-cpu
    license: MIT
  xtts-v2:
    engine: engines.tts.xtts_engine:XTTSv2
    params: {device: cpu}
    voices: {en: Ana Florence, es-ES: Ana Florence, es-419: Ana Florence,
             pt-BR: Ana Florence, pt-PT: Ana Florence, ja: Ana Florence}
    backend_category: torch-cpu
    license: CPML (non-commercial)
  supertonic-3:                            # 約 1 億參數，ONNX；31 種語言共用 10 種預設聲音（M1–M5、F1–F5）
    engine: engines.tts.supertonic_engine:SupertonicTTS
    params: {model: supertonic-3}
    voices: {en: F1, es-ES: F1, es-419: F1, pt-BR: F1, pt-PT: F1, ja: F1}   # 不區分方言
    backend_category: onnx-cpu
    license: OpenRAIL-M
    streaming: sentence
  chatterbox-mtl:
    engine: engines.tts.chatterbox_engine:ChatterboxMultilingualTTS
    params: {device: cpu}
    voices: {en: default, es-ES: default, es-419: default, pt-BR: default, pt-PT: default, ja: default}
    backend_category: torch-cpu
    license: MIT

llm:
  qwen2.5-1.5b-q4:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: Qwen/Qwen2.5-1.5B-Instruct-GGUF, filename: "*q4_k_m.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Apache-2.0
  qwen2.5-3b-q4:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: Qwen/Qwen2.5-3B-Instruct-GGUF, filename: "*q4_k_m.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Qwen Research License
  gemma-3-1b-q4:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: ggml-org/gemma-3-1b-it-GGUF, filename: "*Q4_K_M.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Gemma Terms of Use
  gemma-3-4b-q4:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: ggml-org/gemma-3-4b-it-GGUF, filename: "*Q4_K_M.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Gemma Terms of Use
  llama-3.2-3b-q4:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: bartowski/Llama-3.2-3B-Instruct-GGUF, filename: "*Q4_K_M.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Llama 3.2 Community License
  # ---- 醫療照護評測的新候選（2026-10-05；見 docs/roadmap.md「LLM 評測：醫療照護情境」）
  qwen3-1.7b-q4:                             # 思考 / 不思考混合模型；評測用不思考模式
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: unsloth/Qwen3-1.7B-GGUF, filename: "Qwen3-1.7B-Q4_K_M.gguf", n_threads: 4}
    user_suffix: " /no_think"
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Apache-2.0
  qwen3-4b-2507-q4:                          # Qwen3-4B-Instruct-2507：只有不思考模式
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: unsloth/Qwen3-4B-Instruct-2507-GGUF, filename: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Apache-2.0
  medgemma-4b-q4:                            # Google 醫療專用（Gemma 3 4B 衍生）；原版需同意條款，此為 unsloth 轉檔
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: unsloth/medgemma-4b-it-GGUF, filename: "medgemma-4b-it-Q4_K_M.gguf", n_threads: 4}
    backend_category: llamacpp-cpu
    quant: q4_k_m
    license: Health AI Developer Foundations Terms（商用前需法務確認）
    specialized: medical
  gemma-3-4b-q4-cuda:
    engine: engines.llm.llama_cpp_engine:LlamaCppLLM
    params: {repo_id: ggml-org/gemma-3-4b-it-GGUF, filename: "*Q4_K_M.gguf", n_gpu_layers: -1}
    backend_category: llamacpp-cuda
    quant: q4_k_m
    license: Gemma Terms of Use
